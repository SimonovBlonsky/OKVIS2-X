camera_parameters:
  timestamp_tolerance: 0.075
  sync_cameras: [0, 1, 2, 3]
  image_delay: -0.000080005
  online_calibration:
    do_extrinsics: 1
    do_extrinsics_final_ba: 1
    sigma_r: 0.001
    sigma_alpha: 0.005
    sigma_r_final_ba: 0.003
    sigma_alpha_final_ba: 0.016
  fov_scale: 0.9

imu_parameters:
  use: 1
  a_max: 176.0
  g_max: 7.8
  sigma_g_c:  1.4331e-03   # gyroscope_noise_density
  sigma_a_c:  1.7724e-02   # accelerometer_noise_density
  sigma_bg: 0.01
  sigma_ba: 0.1
  sigma_gw_c: 5.8001e-05   # gyroscope_random_walk
  sigma_aw_c: 7.5312e-04   # accelerometer_random_walk
  g: 9.81007
  g0: [0.0, 0.0, 0.0]
  a0: [0.0, 0.0, 0.0]
  s_a: [1.0, 1.0, 1.0]
