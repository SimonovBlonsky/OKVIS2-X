        -0.0042205645, -0.6161550223, 0.7876135952, 0.0091001127,
        0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000],
     image_dimension: [960, 600],
     distortion_coefficients: [0.0, 0.0, 0.0, 0.0],
     distortion_type: none,
     focal_length: [311.17238897, 311.21955389],
     principal_point: [482.57738388, 298.28638552],
     eucm_parameters: [0.6617536865, 1.0779248320],
     cam_model: eucm,
     camera_type: grayscale,
     slam_use: okvis}

  # cam2 (back-left)  EUCM: alpha=0.6613297349  beta=1.0781946593
  - {T_SC:
       [0.9998440958, 0.0110328213, 0.0137862579, 0.0228428705,
