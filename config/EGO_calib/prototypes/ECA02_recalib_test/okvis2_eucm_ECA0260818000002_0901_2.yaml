     eucm_parameters: [0.6605987894, 1.0781808622],
     cam_model: eucm,
     camera_type: grayscale,
     slam_use: okvis}

camera_parameters:
  timestamp_tolerance: 0.075
  sync_cameras: [0, 1, 2, 3]
  image_delay: -2.7658391264991494e-05
  online_calibration:
    do_extrinsics: 1
    do_extrinsics_final_ba: 1
    sigma_r: 0.001
    sigma_alpha: 0.005
    sigma_r_final_ba: 0.003
    sigma_alpha_final_ba: 0.016
  fov_scale: 0.9

imu_parameters:
  use: 1
  a_max: 176.0
  g_max: 7.8
  sigma_g_c:  1.4178886325033910e-03   # gyroscope_noise_density
  sigma_a_c:  1.8952897061133931e-02   # accelerometer_noise_density
  sigma_bg: 0.01
  sigma_ba: 0.1
  sigma_gw_c: 6.9218674160685217e-05   # gyroscope_random_walk
  sigma_aw_c: 8.1874748721259599e-04   # accelerometer_random_walk
  g: 9.81007
  g0: [0.0, 0.0, 0.0]
  a0: [0.0, 0.0, 0.0]
  s_a: [1.0, 1.0, 1.0]
  T_BS:
    [1.0000000000, 0.0000000000, 0.0000000000, 0.0000000000,
     0.0000000000, 1.0000000000, 0.0000000000, 0.0000000000,
     0.0000000000, 0.0000000000, 1.0000000000, 0.0000000000,
     0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]

frontend_parameters:
  detection_threshold: 50.0
  absolute_threshold: 20.0
  matching_threshold: 60.0
  octaves: 0
  max_num_keypoints: 400
  keyframe_overlap: 0.59
  use_cnn: 0
  parallelise_detection: 1
  num_matching_threads: 8

estimator_parameters:
  num_keyframes: 5
  num_loop_closure_frames: 5
  num_imu_frames: 3
  do_loop_closures: 1
  do_final_ba: 1
  enforce_realtime: 1
  realtime_min_iterations: 3
  realtime_max_iterations: 10
  realtime_time_limit: 0.035
  realtime_num_threads: 8
  full_graph_iterations: 15
  full_graph_num_threads: 4
  p_dbow: 0.4
  drift_percentage_heuristic: 1.35

output_parameters:
  display_topview: 1
  display_matches: 1
  display_overhead: 0
  enable_submapping: 0
