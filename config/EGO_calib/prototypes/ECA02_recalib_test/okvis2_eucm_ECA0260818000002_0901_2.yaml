     cam_model: eucm,
     camera_type: grayscale,
     slam_use: okvis}

  # cam3 (back-right)  EUCM: alpha=0.6605987894  beta=1.0781808622
  - {T_SC:
       [0.2632580183, -0.7640002018, 0.5890661316, 0.1103956860,
        -0.1864020813, 0.5588159590, 0.8080711528, 0.0572554684,
        -0.9465460791, -0.3225343633, 0.0047015542, -0.0497054125,
