%YAML:1.2
# OKVis2 配置文件（由第 2 组 20260901 Kalibr 标定结果生成）
# 相机模型：EUCM（Extended Unified Camera Model，Kalibr 直出）
# 外参约定：T_SC = inv(T_cam_imu)
# 图像缩放：×0.5
# 注意：布尔值使用 0/1（OpenCV YAML 解析器不支持 true/false）

cameras:
  # cam0 (front)  EUCM: alpha=0.6619541893  beta=1.0781799198
  - {T_SC:
       [0.2525286665, 0.7659496705, -0.5912278536, -0.1304258724,
        0.1836177669, 0.5619933473, 0.8065035606, 0.0570194209,
        0.9500072569, -0.3122252069, 0.0012774625, -0.0497103807,
        0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000],
     image_dimension: [960, 600],
     distortion_coefficients: [0.0, 0.0, 0.0, 0.0],
     distortion_type: none,
     focal_length: [310.15470585, 310.11890593],
     principal_point: [480.39371789, 300.99859305],
     eucm_parameters: [0.6619541893, 1.0781799198],
     cam_model: eucm,
     camera_type: grayscale,
     mapping_rectification: 1,
     slam_use: okvis}

  # cam1 (right)  EUCM: alpha=0.6617536865  beta=1.0779248320
  - {T_SC:
       [0.9999831460, -0.0057406352, 0.0008676490, -0.0424973899,
