  timestamp_tolerance: 0.075
  sync_cameras: [0, 1, 2, 3]
  image_delay: 0.024869740
  online_calibration:
    do_extrinsics: 1
    do_extrinsics_final_ba: 1
    sigma_r: 0.001
    sigma_alpha: 0.005
    sigma_r_final_ba: 0.003
    sigma_alpha_final_ba: 0.016
  fov_scale: 0.9

imu_parameters:
  use: 1
  a_max: 176.0
  g_max: 7.8
  sigma_g_c:  1.5769e-03   # gyroscope_noise_density
  sigma_a_c:  1.7347e-02   # accelerometer_noise_density
  sigma_bg: 0.01
  sigma_ba: 0.1
  sigma_gw_c: 9.6212e-05   # gyroscope_random_walk
  sigma_aw_c: 8.7261e-04   # accelerometer_random_walk
