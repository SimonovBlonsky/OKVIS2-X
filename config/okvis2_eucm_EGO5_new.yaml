    do_extrinsics: 1
    do_extrinsics_final_ba: 1
    sigma_r: 0.001
    sigma_alpha: 0.005
    sigma_r_final_ba: 0.003
    sigma_alpha_final_ba: 0.016
  fov_scale: 0.9

imu_parameters:
  use: 1
  a_max: 176.0
  g_max: 7.8
  sigma_g_c:  1.6684e-03   # gyroscope_noise_density
  sigma_a_c:  1.7835e-02   # accelerometer_noise_density
  sigma_bg: 0.01
