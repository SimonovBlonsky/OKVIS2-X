  sigma_aw_c: 7.3804e-04   # accelerometer_random_walk
  g: 9.81007
  g0: [0.0, 0.0, 0.0]
  a0: [0.0, 0.0, 0.0]
  s_a: [1.0, 1.0, 1.0]
